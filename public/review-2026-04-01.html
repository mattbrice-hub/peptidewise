  const current=getStackVal(sectionId,fieldKey,value);
  const changed=current!==value;
  return `<select class="edit-select${changed?" changed":""}" data-section="${sectionId}" data-field="${fieldKey}" data-original="${value}" onchange="handleInline(this)">
    ${options.map(o=>`<option value="${o}"${current===o?" selected":""}>${o}</option>`).join("")}
  </select>`;
}

function renderInlineEdit(sectionId,fieldKey,value,placeholder){
  const current=getStackVal(sectionId,fieldKey,value);
  const changed=current!==value;
  return `<input class="edit-inline${changed?" changed":""}" value="${current.replace(/"/g,"&quot;")}" placeholder="${placeholder||""}" data-section="${sectionId}" data-field="${fieldKey}" data-original="${btoa(unescape(encodeURIComponent(value)))}" oninput="handleInline(this)">`;
}

function renderNumberEdit(sectionId,fieldKey,value){
  const current=getStackVal(sectionId,fieldKey,String(value));
  const changed=current!==String(value);
  return `<input type="number" class="edit-number${changed?" changed":""}" value="${current}" data-section="${sectionId}" data-field="${fieldKey}" data-original="${value}" oninput="handleInline(this)">`;
}

function renderPeptide(p){
  const categories=["Tissue Repair","Growth Hormone","Weight Management","Sexual Health","Cognitive / Anxiolytic","Anti-Aging","Skin & Hair","Sleep","Immune"];
  const researchStatuses=["Emerging","Well-studied","Preliminary"];
  const legalStatuses=["Research-only","Prescription","Supplement","FDA-approved"];

  return `<div class="section" id="sec-${p.id}">
    <div class="section-header">
      <div><div class="section-title">${p.name}${p.isNew?'<span class="new-badge">New</span>':''}</div></div>
      <span class="section-badge badge-${(state[p.id]||{}).status||"pending"}">${(state[p.id]||{}).status||"pending"}</span>
    </div>
    <div class="card">
      <div class="field-row" style="margin-bottom:16px">
        <div class="field"><div class="field-label">Category</div>${renderSelectEdit(p.id,"category",p.category,categories)}</div>
        <div class="field"><div class="field-label">Research Status</div>${renderSelectEdit(p.id,"researchStatus",p.researchStatus,researchStatuses)}</div>
        <div class="field"><div class="field-label">Legal Status</div>${renderSelectEdit(p.id,"legalStatus",p.legalStatus,legalStatuses)}</div>
      </div>
      <div class="field"><div class="field-label">Short Description</div>${renderEditable(p.id,"description",p.description)}</div>
      <div class="field"><div class="field-label">Detailed Description</div>${renderEditable(p.id,"detailedDescription",p.detailedDescription)}</div>
      <div class="field-row">
        <div class="field"><div class="field-label">Research Score (1-10)</div>${renderPeptideSelect(p.id,"researchScore",String(p.researchScore))}</div>
        <div class="field"><div class="field-label">Safety Score (1-10)</div>${renderPeptideSelect(p.id,"safetyScore",String(p.safetyScore))}</div>
      </div>
      <div class="field"><div class="field-label">Typical Dosage</div>${renderInlineEdit(p.id,"dosage",p.dosage,"e.g. 200-500 mcg daily")}</div>
      <div class="field-row">
        <div class="field"><div class="field-label">Cycle Length</div>${renderInlineEdit(p.id,"cycle",p.cycle,"e.g. 4-12 weeks")}</div>
        <div class="field"><div class="field-label">Administration Routes</div>${renderInlineEdit(p.id,"routes",p.routes,"e.g. Subcutaneous, Oral")}</div>
      </div>
      <h4>Benefits</h4><div class="pills">${p.benefits.map(b=>`<span class="pill">${b}</span>`).join("")}</div>
      <h4>Side Effects</h4><div class="pills">${p.sideEffects.map(s=>`<span class="pill">${s}</span>`).join("")}</div>
      <h4>Contraindications</h4><div class="pills">${p.contraindications.map(c=>`<span class="pill" style="border:1px solid rgba(239,68,68,.3)">${c}</span>`).join("")}</div>
      <h4>Dr. Taylor's Clinical Note</h4>
      <div class="dr-note">${renderEditable(p.id,"drTaylorNote",p.drTaylorNote)}</div>
      <h4>Published References</h4>
      ${p.references.map(renderRef).join("")}
    </div>
    ${renderReviewControls(p.id)}
  </div>`;
}

function renderPeptideSelector(sectionId,currentPeptides){
  const original=currentPeptides;
  const current=getStackVal(sectionId,"peptides",original);
  const selected=current.split(", ").map(s=>s.trim()).filter(Boolean);
  const allNames=DATA.peptides.map(p=>p.name);
  return `<div class="field"><div class="field-label">Peptides Included <span style="font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0">(click to add/remove)</span></div>
    <div class="pills" style="margin-top:8px">${allNames.map(name=>{
      const isSelected=selected.includes(name);
      return `<span class="peptide-chip${isSelected?" selected":""}" onclick="togglePeptide('${sectionId}','${name}','${btoa(unescape(encodeURIComponent(original)))}')">${name}</span>`;
    }).join("")}</div>
  </div>`;
}

function renderBmiSelector(sectionId,currentBmi){
  const original=currentBmi;
  const current=getStackVal(sectionId,"bmi",original);
  const selectedCats=current.split(", ").map(s=>s.trim());
  const allCats=["All","Underweight","Normal","Overweight","Obese"];
  return `<div class="field"><div class="field-label">BMI Categories</div>
    <div class="checkbox-group">${allCats.map(cat=>{
      const isActive=selectedCats.includes(cat)||(cat==="All"&&current==="All");
      return `<label class="checkbox-label${isActive?" active":""}${current!==original?" changed-group":""}">
        <input type="checkbox" ${isActive?"checked":""} onchange="toggleBmi('${sectionId}','${cat}','${btoa(unescape(encodeURIComponent(original)))}')"> ${cat}
      </label>`;
    }).join("")}</div>
  </div>`;
}

function renderGenderSelector(sectionId,currentGender){
  const original=currentGender;
  const current=getStackVal(sectionId,"gender",original);
  const opts=["All","Male","Female"];
  return `<div class="field"><div class="field-label">Gender</div>
    <div class="checkbox-group">${opts.map(g=>{
      const isActive=current===g;
      return `<label class="checkbox-label${isActive?" active":""}${current!==original?" changed-group":""}">
        <input type="radio" name="gender-${sectionId}" ${isActive?"checked":""} onchange="handleGender('${sectionId}','${g}','${btoa(unescape(encodeURIComponent(original)))}')"> ${g}
      </label>`;
    }).join("")}</div>
  </div>`;
}

function togglePeptide(sectionId,name,origB64){
  const original=decodeURIComponent(escape(atob(origB64)));
  const current=getStackVal(sectionId,"peptides",original);
  let arr=current.split(", ").map(s=>s.trim()).filter(Boolean);
  if(arr.includes(name))arr=arr.filter(x=>x!==name);
  else arr.push(name);
  const newVal=arr.join(", ");
  if(!state[sectionId])state[sectionId]={status:"pending",note:"",changes:{}};
  if(!state[sectionId].changes)state[sectionId].changes={};
  if(newVal===original)delete state[sectionId].changes.peptides;
  else state[sectionId].changes.peptides=newVal;
  saveState();render();
}

function toggleBmi(sectionId,cat,origB64){
  const original=decodeURIComponent(escape(atob(origB64)));
  const current=getStackVal(sectionId,"bmi",original);
  let arr=current.split(", ").map(s=>s.trim()).filter(Boolean);
  if(cat==="All"){arr=["All"]}
  else{
    arr=arr.filter(x=>x!=="All");
    if(arr.includes(cat))arr=arr.filter(x=>x!==cat);
    else arr.push(cat);
    if(arr.length===0)arr=["All"];
  }
  const newVal=arr.join(", ");
  if(!state[sectionId])state[sectionId]={status:"pending",note:"",changes:{}};
  if(!state[sectionId].changes)state[sectionId].changes={};
  if(newVal===original)delete state[sectionId].changes.bmi;
  else state[sectionId].changes.bmi=newVal;
  saveState();render();
}

function handleGender(sectionId,val,origB64){
  const original=decodeURIComponent(escape(atob(origB64)));
  if(!state[sectionId])state[sectionId]={status:"pending",note:"",changes:{}};
  if(!state[sectionId].changes)state[sectionId].changes={};
  if(val===original)delete state[sectionId].changes.gender;
  else state[sectionId].changes.gender=val;
  saveState();render();
}

function handleInline(el){
  const section=el.dataset.section;
  const field=el.dataset.field;
  const original=el.dataset.original.length>20?decodeURIComponent(escape(atob(el.dataset.original))):el.dataset.original;
  if(!state[section])state[section]={status:"pending",note:"",changes:{}};
  if(!state[section].changes)state[section].changes={};
  if(el.value===original)delete state[section].changes[field];
  else state[section].changes[field]=el.value;
  el.classList.toggle("changed",el.value!==original);
  saveState();
}

function renderStack(s){
  const sid = "stack-"+s.id;
  const st = state[sid]||{status:"pending",note:"",changes:{}};
  const currentName = getStackVal(sid,"name",s.name);
  const nameChanged = currentName!==s.name;

  return `<div class="section" id="sec-${sid}">
    <div class="section-header">
      <div style="flex:1">
        <input class="edit-inline${nameChanged?" changed":""}" value="${currentName.replace(/"/g,"&quot;")}" style="font-size:22px;font-weight:700;background:transparent;padding:4px 8px" data-section="${sid}" data-field="name" data-original="${btoa(unescape(encodeURIComponent(s.name)))}" oninput="handleInline(this)" placeholder="Protocol name...">
        ${s.highlight?`<span style="font-size:12px;color:var(--orange);margin-left:8px">${s.highlight}</span>`:""}
      </div>
      <span class="section-badge badge-${st.status}">${st.status}</span>
    </div>
    <div class="card">
      <div class="field"><div class="field-label">Subtitle</div>${renderInlineEdit(sid,"subtitle",s.subtitle,"Subtitle...")}</div>

      ${renderPeptideSelector(sid,s.peptides)}

      <div class="field"><div class="field-label">Target Symptoms</div>${renderInlineEdit(sid,"target",s.target,"Comma-separated symptoms...")}</div>

      <div class="field-row">
        <div class="field"><div class="field-label">Age Min</div>${renderNumberEdit(sid,"ageMin",s.age.split("-")[0])}</div>
        <div class="field"><div class="field-label">Age Max</div>${renderNumberEdit(sid,"ageMax",s.age.split("-")[1])}</div>
      </div>

      ${renderGenderSelector(sid,s.gender)}
      ${renderBmiSelector(sid,s.bmi)}

      <h4>Description</h4>${renderEditable(sid,"description",s.description)}
      <h4>Dr. Taylor's Note</h4>
      <div class="dr-note">${renderEditable(sid,"drTaylorNote",s.drTaylorNote)}</div>
    </div>
    ${renderReviewControls(sid)}
  </div>`;
}

function renderDisclaimers(){
  return `<div class="section" id="sec-disclaimers">
    <div class="section-header"><div class="section-title">Disclaimers &amp; Legal Language</div><span class="section-badge badge-${state.disclaimers.status}">${state.disclaimers.status}</span></div>
    <div class="card">
      <div class="field"><div class="field-label">Footer Disclaimer (all pages)</div>${renderEditable("disclaimers","footer",DATA.disclaimers.footer)}</div>
      <div class="field"><div class="field-label">Results Page Disclaimer</div>${renderEditable("disclaimers","results",DATA.disclaimers.results)}</div>
      <div class="field"><div class="field-label">Protocols Page Disclaimer</div>${renderEditable("disclaimers","stacks",DATA.disclaimers.stacks)}</div>
    </div>
    ${renderReviewControls("disclaimers")}
  </div>`;
}

function renderSidebar(){
  let html = `<h3>Bio &amp; Background</h3>`;
  html += `<div class="nav-item" onclick="navTo('sec-bio')"><span class="nav-status ${state.bio.status}"></span>About Dr. Taylor</div>`;
  html += `<h3>Peptides (${DATA.peptides.length})</h3>`;
  DATA.peptides.forEach(p => {
    html += `<div class="nav-item" onclick="navTo('sec-${p.id}')"><span class="nav-status ${(state[p.id]||{}).status||"pending"}"></span>${p.name}${p.isNew?' <span class="new-badge">New</span>':''}</div>`;
  });
  html += `<h3>Protocols (${DATA.stacks.length})</h3>`;
  DATA.stacks.forEach(s => {
    const sid = "stack-"+s.id;
    html += `<div class="nav-item" onclick="navTo('sec-${sid}')"><span class="nav-status ${(state[sid]||{}).status||"pending"}"></span>${s.name}</div>`;
  });
  html += `<h3>Legal</h3>`;
  html += `<div class="nav-item" onclick="navTo('sec-disclaimers')"><span class="nav-status ${state.disclaimers.status}"></span>Disclaimers</div>`;
  document.getElementById("sidebar").innerHTML = html;
}

function renderMain(){
  let html = renderBio();
  html += `<div class="divider"></div><h2 style="font-size:28px;font-weight:700;margin-bottom:24px">Peptide Profiles (${DATA.peptides.length})</h2>`;
  DATA.peptides.forEach(p => html += renderPeptide(p));
  html += `<div class="divider"></div><h2 style="font-size:28px;font-weight:700;margin-bottom:24px">Peptide Protocols (${DATA.stacks.length})</h2>`;
  DATA.stacks.forEach(s => html += renderStack(s));
  html += `<div class="divider"></div>` + renderDisclaimers();
  document.getElementById("main").innerHTML = html;
}

function updateStats(){
  let a=0,r=0,p=0;
  for(const k of Object.keys(state)){
    if(state[k].status==="approved")a++;
    else if(state[k].status==="revision")r++;
    else p++;
  }
  document.getElementById("stat-approved").textContent=a;
  document.getElementById("stat-revision").textContent=r;
  document.getElementById("stat-pending").textContent=p;
}

function render(){renderSidebar();renderMain();updateStats()}

// ==================== ACTIONS ====================
function setStatus(id,status){
  if(!state[id])state[id]={status:"pending",note:"",changes:{}};
  state[id].status = state[id].status===status ? "pending" : status;
  saveState();render();
}

function setNote(id,note){
  if(!state[id])state[id]={status:"pending",note:"",changes:{}};
  state[id].note=note;
  saveState();
}

function handleEdit(el){
  const section=el.dataset.section;
  const field=el.dataset.field;
  const original=decodeURIComponent(escape(atob(el.dataset.original)));
  if(!state[section])state[section]={status:"pending",note:"",changes:{}};
  if(!state[section].changes)state[section].changes={};
  if(el.value===original){delete state[section].changes[field]}
  else{state[section].changes[field]=el.value}
  el.classList.toggle("changed",el.value!==original);
  saveState();
}

function navTo(id){const el=document.getElementById(id);if(el){const top=el.getBoundingClientRect().top+window.pageYOffset-80;window.scrollTo({top,behavior:"smooth"})}}

function approveAll(){
  for(const k of Object.keys(state)){if(state[k].status==="pending")state[k].status="approved"}
  saveState();render();
}

function exportMarkdown(){
  let md = `# PeptideWise Content Review \u2014 April 2026\n**Exported: ${new Date().toLocaleDateString()}\n\n`;

  let approved=0,revision=0,pending=0;
  for(const k of Object.keys(state)){
    if(state[k].status==="approved")approved++;
    else if(state[k].status==="revision")revision++;
    else pending++;
  }
  md += `## Summary\n- Approved: ${approved}\n- Needs Revision: ${revision}\n- Pending: ${pending}\n\n`;

  let hasChanges = false;

  for(const[id,s] of Object.entries(state)){
    const changes = s.changes && Object.keys(s.changes).length > 0;
    const hasNote = s.note && s.note.trim();
    if(s.status==="revision" || changes || hasNote){
      hasChanges = true;
      const name = id==="bio"?"About Dr. Taylor":id==="disclaimers"?"Disclaimers":id.startsWith("stack-")?DATA.stacks.find(x=>"stack-"+x.id===id)?.name||id:DATA.peptides.find(x=>x.id===id)?.name||id;
      md += `---\n\n### ${name}\n**Status:** ${s.status.toUpperCase()}\n`;
      if(hasNote) md += `**Note:** ${s.note}\n`;
      if(changes){
        md += `\n**Content Changes:**\n`;
        for(const[field,value] of Object.entries(s.changes)){
          md += `\n#### Field: \`${field}\`\n\`\`\`\n${value}\n\`\`\`\n`;
        }
      }
      md += "\n";
    }
  }

  if(!hasChanges) md += `---\n\nNo revisions or changes requested. All content approved as-is.\n`;

  document.getElementById("exportText").value = md;
  document.getElementById("exportModal").classList.add("show");
}

function copyExport(){
  const t=document.getElementById("exportText");
  t.select();
  document.execCommand("copy");
  alert("Copied to clipboard!");
}

// ==================== INIT ====================
initState();
render();
</script>
